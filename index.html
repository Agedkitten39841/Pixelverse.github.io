<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avezoov</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 0 auto;
            padding-top: 100px;
        }

        h1 {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 65px;
            letter-spacing: 2px;
        }

        .section {
            margin-bottom: 35px;
        }

        .label {
            display: block;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .copy-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px;
            border: 1px solid #333333;
            border-radius: 10px;
            background-color: #111111;
        }

        .username {
            font-size: 18px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        button {
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 6px;
            padding: 9px 14px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }

        button:hover {
            background-color: #cccccc;
        }

        .telegram-link {
            display: block;
            padding: 15px;
            border: 1px solid #333333;
            border-radius: 10px;
            background-color: #111111;
            color: #ffffff;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            overflow-wrap: anywhere;
            transition: 0.2s;
        }

        .telegram-link:hover {
            background-color: #222222;
        }

        #message {
            margin-top: 12px;
            font-size: 14px;
            color: #aaaaaa;
            min-height: 18px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Avezoov</h1>

        <div class="section">
            <span class="label">Telegram Username</span>

            <div class="copy-box">
                <span class="username" id="username">@frozeneen</span>
                <button onclick="copyUsername()">Copy</button>
            </div>

            <div id="message" aria-live="polite"></div>
        </div>

        <div class="section">
            <span class="label">Telegram Link</span>

            <a
                class="telegram-link"
                href="https://t.me/Tarakanchaebancha"
                target="_blank"
                rel="noopener noreferrer"
            >
                https://t.me/Tarakanchaebancha
            </a>
        </div>

    </div>

    <script>
        async function copyUsername() {
            const username = "@frozeneen";
            const message = document.getElementById("message");

            try {
                await navigator.clipboard.writeText(username);
                message.textContent = "Username copied successfully!";
            } catch (error) {
                const input = document.createElement("textarea");
                input.value = username;
                input.style.position = "fixed";
                input.style.opacity = "0";
                document.body.appendChild(input);
                input.select();

                const success = document.execCommand("copy");
                input.remove();

                message.textContent = success
                    ? "Username copied successfully!"
                    : "Please copy the username manually.";
            }
        }
    </script>

</body>
</html>
